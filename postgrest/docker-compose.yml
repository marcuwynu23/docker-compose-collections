services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  # optional seed file
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: postgrest_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:your_password@db:5432/app_db
      PGRST_DB_SCHEMA: api          # schema to expose as REST
      PGRST_DB_ANON_ROLE: anon     # role for unauthenticated requests
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3000
      PGRST_DB_POOL: 10
    ports:
      - "3000:3000"

  swagger:
    image: swaggerapi/swagger-ui:latest
    container_name: swagger_ui
    restart: unless-stopped
    depends_on:
      - postgrest
    environment:
      API_URL: http://localhost:3000/
    ports:
      - "8080:8080"

volumes:
  pgdata:
