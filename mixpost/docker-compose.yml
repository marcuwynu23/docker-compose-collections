services:
  mixpost:
    image: inovector/mixpost:latest
    container_name: mixpost
    restart: unless-stopped
    ports:
      - "9000:80"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - MIXPOST_DB_HOST=mysql
      - MIXPOST_DB_DATABASE=mixpost
      - MIXPOST_DB_USER=mixpost
      - MIXPOST_DB_PASSWORD=mixpost
      - MIXPOST_REDIS_HOST=redis
      - MIXPOST_APP_URL=http://localhost:9000
    volumes:
      - mixpost_storage:/var/www/html/storage/app
      - mixpost_logs:/var/www/html/storage/logs

  mysql:
    image: mysql/mysql-server:8.0
    container_name: mixpost-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mixpost
      MYSQL_USER: mixpost
      MYSQL_PASSWORD: mixpost
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - mixpost_mysql:/var/lib/mysql

  redis:
    image: redis:latest
    container_name: mixpost-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - mixpost_redis:/data

volumes:
  mixpost_mysql:
  mixpost_redis:
  mixpost_storage:
  mixpost_logs: