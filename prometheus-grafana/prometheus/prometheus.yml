global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # App server metrics target:
  # - Expects your app to expose a Prometheus endpoint (commonly /metrics)
  # - If your app runs in Docker Compose, use service name + internal port
  # - If your app runs on the host (outside container):
  #   - Podman: host.containers.internal:<port>
  #   - Docker Desktop: host.docker.internal:<port>
  - job_name: "api_server"
    static_configs:
      - targets: ["app:5000"]
