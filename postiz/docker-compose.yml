services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: postiz
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postiz-user:postiz-password@db:5432/postiz-db
      - REDIS_URL=redis://redis:6379
      - TEMPORAL_ADDRESS=temporal:7233
      - JWT_SECRET=${POSTIZ_JWT_SECRET}
      - FRONTEND_URL=${POSTIZ_FRONTEND_URL:-http://localhost:4200}
      - NEXT_PUBLIC_BACKEND_URL=${POSTIZ_BACKEND_URL:-http://localhost:3000}
      - BACKEND_INTERNAL_URL=http://postiz:3000
      - STORAGE_PROVIDER=${POSTIZ_STORAGE_PROVIDER:-local}
    env_file:
      - .env

  db:
    image: postgres:16
    container_name: postiz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postiz-user
      POSTGRES_PASSWORD: postiz-password
      POSTGRES_DB: postiz-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz-user -d postiz-db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postiz_db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: postiz-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postiz_redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: postiz-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${POSTIZ_MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${POSTIZ_MINIO_ROOT_PASSWORD:-password}
    volumes:
      - postiz_minio_data:/data

  temporal:
    image: temporalio/auto-setup:latest
    container_name: postiz-temporal
    restart: unless-stopped
    ports:
      - "7233:7233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=postiz-user
      - POSTGRES_PWD=postiz-password
      - POSTGRES_SEEDS=db
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/development.yaml
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7233/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postiz_db_data:
  postiz_redis_data:
  postiz_minio_data: