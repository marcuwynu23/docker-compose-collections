services:
  meilisearch:
    image: getmeili/meilisearch:v1.9
    container_name: meilisearch
    ports:
      - "${MEILI_PORT:-7700}:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-changeme}
      - MEILI_ENV=${MEILI_ENV:-development}
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped

volumes:
  meili_data:
