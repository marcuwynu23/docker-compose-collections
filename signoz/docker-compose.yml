services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: signoz-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      PORT: ${APP_PORT:-5000}
      NODE_ENV: ${NODE_ENV:-development}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://signoz-ingester:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-express-app}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    depends_on:
      - signoz-ingester

  signoz-metastore-postgres-0:
    container_name: signoz-postgres
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SIGNOZ_POSTGRES_DB:-signoz}
      POSTGRES_USER: ${SIGNOZ_POSTGRES_USER:-signoz}
      POSTGRES_PASSWORD: ${SIGNOZ_POSTGRES_PASSWORD:-signoz}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signoz -d signoz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - signoz-metastore-postgres-0-data:/var/lib/postgresql/data

  signoz-telemetrykeeper-clickhousekeeper-0:
    container_name: signoz-clickhousekeeper
    image: clickhouse/clickhouse-keeper:25.12.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clickhouse-keeper-client", "-h", "localhost", "-p", "9181", "-q", "ls"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - signoz-telemetrykeeper-0-data:/var/lib/clickhouse-keeper
      - ./telemetrykeeper/clickhousekeeper/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml:ro

  signoz-telemetrystore-clickhouse-user-scripts:
    container_name: signoz-clickhouse-user-scripts
    image: clickhouse/clickhouse-server:25.12.5
    restart: on-failure
    command:
      - bash
      - -c
      - |-
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xvzf histogram-quantile.tar.gz
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    volumes:
      - signoz-telemetrystore-user-scripts:/var/lib/clickhouse/user_scripts

  signoz-telemetrystore-clickhouse-0-0:
    container_name: signoz-clickhouse
    depends_on:
      signoz-telemetrykeeper-clickhousekeeper-0:
        condition: service_healthy
      signoz-telemetrystore-clickhouse-user-scripts:
        condition: service_completed_successfully
    image: clickhouse/clickhouse-server:25.12.5
    restart: unless-stopped
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      CLICKHOUSE_CONFIG: /etc/clickhouse-server/config-0-0.yaml
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - signoz-telemetrystore-0-0-data:/var/lib/clickhouse
      - signoz-telemetrystore-user-scripts:/var/lib/clickhouse/user_scripts:ro
      - ./telemetrystore/clickhouse/config-0-0.yaml:/etc/clickhouse-server/config-0-0.yaml:ro
      - ./telemetrystore/clickhouse/functions.yaml:/etc/clickhouse-server/functions.yaml:ro

  signoz-telemetrystore-migrator:
    container_name: signoz-migrator
    image: signoz/signoz-otel-collector:latest
    restart: on-failure
    depends_on:
      signoz-telemetrystore-clickhouse-0-0:
        condition: service_healthy
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        /signoz-otel-collector migrate ready &&
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up
    environment:
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://signoz-telemetrystore-clickhouse-0-0:9000
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m

  signoz:
    container_name: signoz
    image: signoz/signoz:latest
    restart: unless-stopped
    depends_on:
      signoz-metastore-postgres-0:
        condition: service_healthy
      signoz-telemetrystore-clickhouse-0-0:
        condition: service_healthy
    ports:
      - "${SIGNOZ_PORT:-8080}:8080"
    environment:
      SIGNOZ_SQLSTORE_PROVIDER: ${SIGNOZ_SQLSTORE_PROVIDER:-postgres}
      SIGNOZ_SQLSTORE_POSTGRES_DSN: postgres://${SIGNOZ_POSTGRES_USER:-signoz}:${SIGNOZ_POSTGRES_PASSWORD:-signoz}@signoz-metastore-postgres-0:5432/${SIGNOZ_POSTGRES_DB:-signoz}?sslmode=disable
      SIGNOZ_TELEMETRYSTORE_PROVIDER: ${SIGNOZ_TELEMETRYSTORE_PROVIDER:-clickhouse}
      SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN: tcp://signoz-telemetrystore-clickhouse-0-0:9000
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - signoz_signoz-data:/var/lib/signoz/

  signoz-ingester:
    container_name: signoz-ingester
    image: signoz/signoz-otel-collector:latest
    restart: unless-stopped
    depends_on:
      signoz-telemetrystore-clickhouse-0-0:
        condition: service_healthy
      signoz-telemetrystore-migrator:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector --config=/etc/otel-collector-config.yaml --manager-config=/etc/opamp-config.yaml --copy-path=/var/tmp/collector-config.yaml
    environment:
      OTEL_RESOURCE_ATTRIBUTES: ${SIGNOZ_OTEL_RESOURCE_ATTRIBUTES:-host.name=signoz-host,os.type=linux}
      LOW_CARDINAL_EXCEPTION_GROUPING: ${SIGNOZ_LOW_CARDINAL_EXCEPTION_GROUPING:-false}
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://signoz-telemetrystore-clickhouse-0-0:9000
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER: cluster
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION: ${SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION:-true}
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
    ports:
      - "${SIGNOZ_OTLP_GRPC_PORT:-4317}:4317"
      - "${SIGNOZ_OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./ingester/ingester.yaml:/etc/otel-collector-config.yaml:ro
      - ./ingester/opamp.yaml:/etc/opamp-config.yaml:ro

volumes:
  signoz-metastore-postgres-0-data:
  signoz-telemetrykeeper-0-data:
  signoz-telemetrystore-0-0-data:
  signoz-telemetrystore-user-scripts:
  signoz_signoz-data:
