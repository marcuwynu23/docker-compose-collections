services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    ports:
      - "${FILEBROWSER_PORT:-8080}:8080"
    volumes:
      - ./data:/srv
      - filebrowser_db:/database
    environment:
      - FB_PORT=8080
    restart: unless-stopped

volumes:
  filebrowser_db:
