services:
  neo4j:
    image: neo4j:latest
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_pagecache_size=${PAGECACHE_SIZE:-512M}
      - NEO4J_dbms_memory_heap_initial__size=${HEAP_INITIAL_SIZE:-512M}
      - NEO4J_dbms_memory_heap_max__size=${HEAP_MAX_SIZE:-1G}
    volumes:
      - ./data/data:/data
      - ./data/logs:/logs
      - ./data/import:/import
      - ./data/plugins:/plugins
      - ./data/conf:/conf
