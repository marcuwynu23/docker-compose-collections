services:
  bugzilla:
    image: nasqueron/bugzilla:latest
    ports:
      - "8080:80"
    environment:
      - DB_TYPE=mysql
      - DB_HOST=db
      - DB_DATABASE=bugzilla   # ✅ FIXED
      - DB_USER=bugzilla
      - DB_PASSWORD=bugzilla
      - BUGZILLA_URL=http://localhost:8080  # ✅ REQUIRED
    depends_on:
      - db

  db:
    image: mysql:5.7
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=bugzilla
      - MYSQL_USER=bugzilla
      - MYSQL_PASSWORD=bugzilla
    volumes:
      - ./data:/var/lib/mysql
