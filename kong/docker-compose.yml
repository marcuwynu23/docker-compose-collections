services:
  kong-database:
    image: postgres:16-alpine
    container_name: kong-db
    env_file:
      - ./config/kong-db.env
    volumes:
      - kong_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KONG_PG_USER:-kong}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kong-migration:
    image: kong:3.7
    container_name: kong-migration
    command: kong migrations bootstrap
    env_file:
      - ./config/kong-migration.env
    depends_on:
      kong-database:
        condition: service_healthy
    restart: on-failure

  kong:
    image: kong:3.7
    container_name: kong
    env_file:
      - ./config/kong.env
    ports:
      - "${KONG_PROXY_PORT:-8000}:8000"
      - "${KONG_PROXY_SSL_PORT:-8443}:8443"
      - "${KONG_ADMIN_PORT:-8001}:8001"
    depends_on:
      kong-database:
        condition: service_healthy
      kong-migration:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  kong_db:
