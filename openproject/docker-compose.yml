services:
  db:
    image: postgres:17
    container_name: openproject-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: openproject
      POSTGRES_USER: openproject
      POSTGRES_PASSWORD: openproject
    volumes:
      - pgdata:/var/lib/postgresql/data

  openproject:
    image: openproject/openproject:17
    container_name: openproject
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      SECRET_KEY_BASE: ba53881bae879fe3cbbdcbb09a7a644b4bdf881db1132798fb979c12af5c266eb550d8350a767e4fddb302930a522d5625c701b92fc7e98f8b55c8eda00d5dab
      OPENPROJECT_HOST__NAME: localhost:8080
      OPENPROJECT_HTTPS: "false"
      DATABASE_URL: postgres://openproject:openproject@db:5432/openproject
    volumes:
      - ./data:/var/openproject/assets
      - ./logs:/var/log/openproject

volumes:
  pgdata: