services:
  jira:
    image: atlassian/jira-software:latest
    container_name: jira
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ATL_JDBC_URL: jdbc:postgresql://postgres:5432/jiradb
      ATL_JDBC_USER: admin
      ATL_JDBC_PASSWORD: Password@123
    volumes:
      - ./data:/var/atlassian/application-data/jira
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Password@123
      POSTGRES_DB: jiradb
    volumes:
      - db-data:/var/lib/postgresql/data  # <--- CHANGED: No longer points to ./db-data

volumes:
  db-data: # <--- ADDED: Defines the volume managed by Docker
