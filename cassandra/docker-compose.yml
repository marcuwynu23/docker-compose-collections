services:
  cassandra:
    image: cassandra:latest
    container_name: cassandra
    ports:
      - "9042:9042"
      - "9160:9160"
    environment:
      - CASSANDRA_CLUSTER_NAME=${CLUSTER_NAME:-MyCluster}
      - CASSANDRA_DC=${DATACENTER:-dc1}
      - CASSANDRA_RACK=${RACK:-rack1}
      - CASSANDRA_ENDPOINT_SNITCH=${SNITCH:-GossipingPropertyFileSnitch}
      - CASSANDRA_NUM_TOKENS=${NUM_TOKENS:-256}
      - MAX_HEAP_SIZE=${MAX_HEAP:-512M}
      - HEAP_NEWSIZE=${HEAP_NEWSIZE:-100M}
    volumes:
      - ./data/data:/var/lib/cassandra/data
      - ./data/commitlog:/var/lib/cassandra/commitlog
      - ./data/saved_caches:/var/lib/cassandra/saved_caches
      - ./data/logs:/var/log/cassandra
      - ./data/conf:/etc/cassandra
