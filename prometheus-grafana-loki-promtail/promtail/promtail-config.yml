server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: express-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: express-logs
          app: api
          __path__: /var/log/express/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            time: time
            req: req
            res: res

      - json:
          source: req
          expressions:
            ip: remoteAddress
            method: method
            url: url

      - json:
          source: res
          expressions:
            status: statusCode

      - labels:
          level:
          app:
          ip:
          method:
          url:
          status:
