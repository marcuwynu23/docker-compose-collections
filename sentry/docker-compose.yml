services:
  sentry-db:
    image: postgres:16
    container_name: sentry-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SENTRY_DB_NAME:-sentry}
      POSTGRES_USER: ${SENTRY_DB_USER:-sentry}
      POSTGRES_PASSWORD: ${SENTRY_DB_PASSWORD:-sentry}
    volumes:
      - sentry_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SENTRY_DB_USER:-sentry} -d ${SENTRY_DB_NAME:-sentry}"]
      interval: 10s
      timeout: 5s
      retries: 10

  sentry-redis:
    image: redis:7
    container_name: sentry-redis
    restart: unless-stopped

  sentry-init:
    image: sentry:latest
    container_name: sentry-init
    restart: "no"
    depends_on:
      sentry-db:
        condition: service_healthy
      sentry-redis:
        condition: service_started
    environment:
      SENTRY_SECRET_KEY: ${SENTRY_SECRET_KEY:-change-me-with-a-long-random-value}
      SENTRY_POSTGRES_HOST: sentry-db
      SENTRY_DB_NAME: ${SENTRY_DB_NAME:-sentry}
      SENTRY_DB_USER: ${SENTRY_DB_USER:-sentry}
      SENTRY_DB_PASSWORD: ${SENTRY_DB_PASSWORD:-sentry}
      SENTRY_REDIS_HOST: sentry-redis
    command: ["upgrade", "--noinput"]
    volumes:
      - sentry_data:/var/lib/sentry/files

  sentry:
    image: sentry:latest
    container_name: sentry
    restart: unless-stopped
    depends_on:
      sentry-init:
        condition: service_completed_successfully
    ports:
      - "${SENTRY_PORT:-9002}:9000"
    environment:
      SENTRY_SECRET_KEY: ${SENTRY_SECRET_KEY:-change-me-with-a-long-random-value}
      SENTRY_POSTGRES_HOST: sentry-db
      SENTRY_DB_NAME: ${SENTRY_DB_NAME:-sentry}
      SENTRY_DB_USER: ${SENTRY_DB_USER:-sentry}
      SENTRY_DB_PASSWORD: ${SENTRY_DB_PASSWORD:-sentry}
      SENTRY_REDIS_HOST: sentry-redis
    command: ["run", "web"]
    volumes:
      - sentry_data:/var/lib/sentry/files

  sentry-worker:
    image: sentry:latest
    container_name: sentry-worker
    restart: unless-stopped
    depends_on:
      sentry-init:
        condition: service_completed_successfully
    environment:
      SENTRY_SECRET_KEY: ${SENTRY_SECRET_KEY:-change-me-with-a-long-random-value}
      SENTRY_POSTGRES_HOST: sentry-db
      SENTRY_DB_NAME: ${SENTRY_DB_NAME:-sentry}
      SENTRY_DB_USER: ${SENTRY_DB_USER:-sentry}
      SENTRY_DB_PASSWORD: ${SENTRY_DB_PASSWORD:-sentry}
      SENTRY_REDIS_HOST: sentry-redis
    command: ["run", "worker"]
    volumes:
      - sentry_data:/var/lib/sentry/files

  sentry-cron:
    image: sentry:latest
    container_name: sentry-cron
    restart: unless-stopped
    depends_on:
      sentry-init:
        condition: service_completed_successfully
    environment:
      SENTRY_SECRET_KEY: ${SENTRY_SECRET_KEY:-change-me-with-a-long-random-value}
      SENTRY_POSTGRES_HOST: sentry-db
      SENTRY_DB_NAME: ${SENTRY_DB_NAME:-sentry}
      SENTRY_DB_USER: ${SENTRY_DB_USER:-sentry}
      SENTRY_DB_PASSWORD: ${SENTRY_DB_PASSWORD:-sentry}
      SENTRY_REDIS_HOST: sentry-redis
    command: ["run", "cron"]
    volumes:
      - sentry_data:/var/lib/sentry/files

volumes:
  sentry_db_data:
  sentry_data:
