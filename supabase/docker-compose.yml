services:
  supabase-db:
    image: postgres:16
    container_name: supabase-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SUPABASE_DB_NAME:-postgres}
      POSTGRES_USER: ${SUPABASE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${SUPABASE_DB_PASSWORD:-postgres}
    ports:
      - "${SUPABASE_DB_PORT:-5433}:5432"
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUPABASE_DB_USER:-postgres} -d ${SUPABASE_DB_NAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  supabase-rest:
    image: postgrest/postgrest:v12.2.3
    container_name: supabase-rest
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://${SUPABASE_DB_USER:-postgres}:${SUPABASE_DB_PASSWORD:-postgres}@supabase-db:5432/${SUPABASE_DB_NAME:-postgres}
      PGRST_DB_SCHEMAS: ${SUPABASE_DB_SCHEMAS:-public}
      PGRST_DB_ANON_ROLE: ${SUPABASE_ANON_ROLE:-anon}
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-chars}
      PGRST_SERVER_PORT: 3000
    ports:
      - "${SUPABASE_REST_PORT:-8000}:3000"

  supabase-ui:
    image: dpage/pgadmin4:latest
    container_name: supabase-ui
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${SUPABASE_UI_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${SUPABASE_UI_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "${SUPABASE_UI_PORT:-5050}:80"
    volumes:
      - supabase_ui_data:/var/lib/pgadmin

volumes:
  supabase_db_data:
  supabase_ui_data:
