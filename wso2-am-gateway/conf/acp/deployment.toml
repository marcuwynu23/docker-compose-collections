[server]
hostname = "wso2-acp"
node_ip = "127.0.0.1"
server_role = "default"
base_path = "${carbon.protocol}://${carbon.host}:${carbon.management.port}"

[user_store]
type = "database_unique_id"

[super_admin]
username = "admin"
password = "admin"                # change this before anything but local testing
create_admin_account = true

# --- Databases ---------------------------------------------------------
# H2 (default/embedded) will NOT work here: the Gateway container also
# needs to read shared_db, and H2 is a local file, not reachable across
# containers. Point both DBs at a real MySQL/Postgres instance reachable
# on wso2-network (e.g. add a `mysql` service to the compose file).
[database.apim_db]
type = "mysql"
hostname = "mysql"                # your DB service/container name
name = "apim_db"
port = "3306"
username = "apimadmin"
password = "apimadmin"

[database.shared_db]
type = "mysql"
hostname = "mysql"
name = "shared_db"
port = "3306"
username = "sharedadmin"
password = "sharedadmin"

[keystore.tls]
file_name = "wso2carbon.jks"
type = "JKS"
password = "wso2carbon"
alias = "wso2carbon"
key_password = "wso2carbon"

[truststore]
file_name = "client-truststore.jks"
type = "JKS"
password = "wso2carbon"

# --- Encryption key (required, must match on ACP and Gateway) ----------
[apim.encryption]
key = "REPLACE_WITH_A_64_CHAR_HEX_KEY"   # generate with: openssl rand -hex 32

# --- Tell the Control Plane where the Gateway is ------------------------
[[apim.gateway.environment]]
name = "Default"
type = "hybrid"
display_in_api_console = true
description = "Default hybrid gateway"
show_as_token_endpoint_url = true
service_url = "https://wso2-gateway:9443/services/"
username = "${admin.username}"
password = "${admin.password}"
ws_endpoint = "ws://wso2-gateway:9099"
wss_endpoint = "wss://wso2-gateway:8099"
http_endpoint = "http://wso2-gateway:8280"
https_endpoint = "https://wso2-gateway:8243"

# --- Event Hub (used by the Gateway to pull API/App/Subscription data) --
[apim.event_hub]
enable = true
username = "$ref{super_admin.username}"
password = "$ref{super_admin.password}"
service_url = "https://localhost:9443/services/"
event_listening_endpoints = ["tcp://localhost:5672"]

[[apim.event_hub.publish.url_group]]
urls = ["tcp://localhost:9611"]
auth_urls = ["ssl://localhost:9711"]

# --- Token revocation notifications (Resident Key Manager) --------------
[[event_listener]]
id = "token_revocation"
type = "org.wso2.carbon.identity.core.handler.AbstractIdentityHandler"
name = "org.wso2.is.notification.ApimOauthEventInterceptor"
order = 1

[event_listener.properties]
notification_endpoint = "https://localhost:9443/internal/data/v1/notify"
username = "${admin.username}"
password = "${admin.password}"
'header.X-WSO2-KEY-MANAGER' = "default"