services:
  wso2-mi:
    image: wso2/wso2mi:4.5.0
    container_name: wso2-mi
    ports:
      - "8290:8290"
      - "8253:8253"
      - "9164:9164"
    volumes:
      - ./conf/deployment.toml:/home/wso2carbon/wso2mi-4.5.0/conf/deployment.toml:ro
    depends_on:
      - wso2-icp
    restart: unless-stopped

  wso2-icp:
    image: wso2/wso2-integration-control-plane:1.0.0
    container_name: wso2-icp
    ports:
      - "9743:9743"
    restart: unless-stopped